<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>CMS Mailbox</title>
    <style>
        /* #appScreen is a fixed 100vh shell with its own internal scroll areas
           (#inboxList, #messagePane) — without this, the outer body ALSO scrolls
           whenever its rendered height exceeds the viewport by even a pixel,
           producing two visible scrollbars instead of one. */
        html, body { height: 100%; overflow: hidden; }
        body { font-family: Segoe UI, Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
        #loginScreen { max-width: 360px; margin: 80px auto; background: #fff; padding: 24px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        #loginScreen input { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
        #loginScreen button { width: 100%; padding: 10px; background: #2c6bd6; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        #appScreen { display: none; height: 100vh; }
        #topBar { background: #1a2c42; color: #fff; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
        #layout { display: flex; height: calc(100vh - 44px); }
        /* #listPane = folder tabs on top + the scrolling message list below. The width/
           background/border that used to live on #inboxList moved up to the wrapper. */
        #listPane { width: 320px; display: flex; flex-direction: column; background: #fff; border-right: 1px solid #ddd; min-height: 0; }
        #folderTabs { display: flex; flex-shrink: 0; border-bottom: 1px solid #ddd; }
        #folderTabs button { flex: 1; padding: 10px 0; background: #fff; border: none; border-bottom: 3px solid transparent; cursor: pointer; font-size: 14px; color: #555; }
        #folderTabs button:hover { background: #f0f4fa; }
        #folderTabs button.active { color: #2c6bd6; border-bottom-color: #2c6bd6; font-weight: bold; }
        #inboxList { flex: 1; min-height: 0; overflow-y: auto; }
        .msgRow { padding: 10px 14px; border-bottom: 1px solid #eee; cursor: pointer; }
        .msgRow:hover { background: #f0f4fa; }
        .msgRow.unread { font-weight: bold; }
        .msgRow .subj { display: block; }
        .msgRow .meta { font-size: 12px; color: #777; font-weight: normal; }
        /* #messagePane is a column: #messageScroll sizes to its own content
           (subject/from/body/the record) and only shrinks — never grows to fill
           leftover space — so short content sits naturally above #replyBox with no
           gap. When content is taller than the available height, #messageScroll
           shrinks to what's left and scrolls internally instead, keeping #replyBox
           fully visible below it either way. */
        #messagePane { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; }
        #messageScroll { flex: 0 1 auto; min-height: 0; padding: 20px; overflow-y: auto; }
        #replyBox { flex-shrink: 0; padding: 12px 20px; background: #fff; }
        .itemCard { border: 1px solid #ddd; border-radius: 4px; padding: 10px; margin: 8px 0; background: #fff; }
        .itemCard button { padding: 6px 12px; }
        table.fieldTable { border-collapse: collapse; width: 100%; margin-top: 8px; }
        table.fieldTable td { border: 1px solid #ddd; padding: 6px 8px; font-size: 13px; }
        table.fieldTable td.k { font-weight: bold; width: 220px; background: #fafafa; }
        #replyBox { border-top: 1px solid #ddd; }
        #replyBox textarea, #replyBox input { width: 100%; box-sizing: border-box; padding: 6px; margin: 4px 0; }
        .err { color: #c0392b; margin: 8px 0; }
        .hint { color: #777; font-size: 13px; }
        button.primary { background: #2c6bd6; color: #fff; border: none; border-radius: 4px; padding: 8px 16px; cursor: pointer; }
        button.secondary { background: #eee; border: 1px solid #ccc; border-radius: 4px; padding: 8px 16px; cursor: pointer; }
        /* ia-viewer.html's ported PopUp() (js/newOpts.js) builds modals as plain divs
           inside its own iframe document — a browser scopes that content to the
           iframe's own small embedded box no matter what CSS the popup itself uses.
           Rather than reparenting popup DOM into this page (which would break every
           bare `document.getElementById` call the ported code makes internally),
           the iframe posts us a message when a popup opens/closes and we grow the
           IFRAME ELEMENT ITSELF to fill the viewport instead — see the message
           listener below. */
        /* top starts at 50px, not 0 — InteractiveForm.js's own "Additional Actions"/
           Save button row (#dispButtons, float:right near the top of the record) would
           otherwise render directly under our fixed Exit Fullscreen button once the
           iframe covers the whole viewport. Reserving this strip keeps the iframe's
           own content entirely below our controls instead of guessing at exact
           overlap pixels. */
        .mbx-iframe-fullscreen { position: fixed !important; top: 50px !important; left: 0 !important; width: 100vw !important; height: calc(100vh - 50px) !important; z-index: 99999; margin: 0 !important; border: none !important; background: #fff; }
        /* Sits above the fullscreened iframe (z-index 99999) as a manual escape hatch —
           the iframe's own PopUp() close button is the normal way out, but this covers
           any close path inside that ported code that doesn't route through
           mbxNotifyPopupState (e.g. navigating away within the iframe without closing
           the modal first). */
        /* #c0392b (matches .err elsewhere in this app) instead of #topBar's own navy —
           the button previously used the exact same navy/white as #topBar behind it
           and was nearly invisible sitting on top of it. */
        #mbxExitFullscreenBtn { display: none; position: fixed; top: 12px; right: 12px; z-index: 100000; background: #c0392b; color: #fff; border: none; border-radius: 4px; padding: 8px 14px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.4); font-weight: bold; }
        /* While any iframe is fullscreen, the reserved 50px top strip (see
           .mbx-iframe-fullscreen) is the only part of the underlying page still
           showing — if an itemCard's header happens to render within that strip
           (e.g. a short message body puts the card near the very top), its own
           "View Fullscreen" button visibly peeks out next to Exit Fullscreen.
           Hiding all item headers while fullscreen is simpler and more robust than
           trying to compute whether a given card's header falls in that strip. */
        body.mbx-fullscreen-active .mbx-item-header { visibility: hidden; }
        /* #topBar is a normal-flow element at the very top of the page — its own
           "Log Out" button (justify-content:space-between pushes it to the right
           edge) sits almost exactly where our fixed Exit Fullscreen button does,
           so it visibly peeked out from behind it. #topBar isn't useful while
           viewing a record fullscreen anyway, so hide it outright rather than
           trying to carve out just the Log Out button. */
        body.mbx-fullscreen-active #topBar { visibility: hidden; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <h2>CMS Mailbox</h2>
        <div id="loginStep">
            <input id="username" placeholder="Username" autocomplete="username" onkeyup="if (event.key === 'Enter') doLogin()" />
            <input id="password" type="password" placeholder="Password" autocomplete="current-password" onkeyup="if (event.key === 'Enter') doLogin()" />
            <button onclick="doLogin()">Log In</button>
        </div>
        <div id="loginLoadingBanner" style="display:none;text-align:center;padding:12px"><img src="loading.gif" width="32" height="32" /></div>
        <div id="mfaStep" style="display:none">
            <p class="hint" id="mfaHint">Enter your authenticator code.</p>
            <img id="mfaBarcode" style="display:none;max-width:100%" />
            <input id="passcode" placeholder="6-digit code" autocomplete="one-time-code" onkeyup="if (event.key === 'Enter') doVerify2fa()" />
            <button onclick="doVerify2fa()">Verify</button>
        </div>
        <div class="err" id="loginError"></div>
    </div>

    <div id="appScreen">
        <div id="topBar">
            <strong>CMS Mailbox</strong>
            <button class="secondary" onclick="logout()">Log Out</button>
        </div>
        <div id="layout">
            <div id="listPane">
                <div id="folderTabs">
                    <button id="tab_inbox" class="active" onclick="setFolder('inbox')">Inbox</button>
                    <button id="tab_sent" onclick="setFolder('sent')">Sent</button>
                    <button id="tab_archived" onclick="setFolder('archived')">Archived</button>
                </div>
                <div id="inboxList"></div>
            </div>
            <div id="messagePane"><p class="hint" style="padding:10px">Select a message.</p></div>
        </div>
    </div>

    <button id="mbxExitFullscreenBtn" onclick="mbxExitFullscreen()">Exit Fullscreen</button>

    <script>
        var apiBase = "";
        var token = sessionStorage.getItem("mbxToken") || "";
        var pendingToken = "";
        var currentMessageId = null;
        var currentFolder = "inbox";   // "inbox" | "sent" | "archived"
        var currentArchived = false;   // whether the open message is archived (recipient's own flag)
        var EMPTY_PANE_HTML = "<p class=\"hint\" style=\"padding:10px\">Select a message.</p>";

        function api(path, opts) {
            opts = opts || {};
            opts.headers = opts.headers || {};
            if (token) opts.headers["Authorization"] = "Bearer " + token;
            return fetch(apiBase + path, opts);
        }

        function doLogin() {
            var u = document.getElementById("username").value;
            var p = document.getElementById("password").value;
            document.getElementById("loginError").innerText = "";
            document.getElementById("loginLoadingBanner").style.display = "block";
            fetch(apiBase + "/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ Username: u, Password: p })
            })
                .then(function (r) { return r.json(); })
                .then(function (res) {
                    document.getElementById("loginLoadingBanner").style.display = "none";
                    if (res.status === "mfa_required") {
                        pendingToken = res.pendingToken;
                        document.getElementById("passcode").value = "";
                        document.getElementById("loginStep").style.display = "none";
                        document.getElementById("mfaStep").style.display = "block";
                        if (res.barcodeUrl) {
                            document.getElementById("mfaBarcode").src = res.barcodeUrl;
                            document.getElementById("mfaBarcode").style.display = "block";
                            document.getElementById("mfaHint").innerText = "Scan this QR code in your authenticator app, then enter the code it shows.";
                        }
                    } else if (res.status === "bad_login") {
                        document.getElementById("loginError").innerText = "Incorrect username or password.";
                    } else if (res.status === "bad_ip") {
                        document.getElementById("loginError").innerText = "New location detected — check your email to validate this IP address, then try again.";
                    } else {
                        document.getElementById("loginError").innerText = "Login failed.";
                    }
                })
                .catch(function () {
                    document.getElementById("loginLoadingBanner").style.display = "none";
                    document.getElementById("loginError").innerText = "Could not reach the server.";
                });
        }

        function doVerify2fa() {
            var code = document.getElementById("passcode").value;
            document.getElementById("loginError").innerText = "";
            fetch(apiBase + "/auth/verify2fa", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ PendingToken: pendingToken, Passcode: code })
            })
                .then(function (r) { return r.json(); })
                .then(function (res) {
                    if (res.status === "ok") {
                        token = res.token;
                        sessionStorage.setItem("mbxToken", token);
                        showApp();
                    } else if (res.status === "invalid_passcode") {
                        document.getElementById("loginError").innerText = "Incorrect code — try again.";
                    } else {
                        document.getElementById("loginError").innerText = "Session expired — log in again.";
                        document.getElementById("mfaStep").style.display = "none";
                        document.getElementById("loginStep").style.display = "block";
                    }
                })
                .catch(function () { document.getElementById("loginError").innerText = "Could not reach the server."; });
        }

        function logout() {
            sessionStorage.removeItem("mbxToken");
            token = "";
            document.getElementById("appScreen").style.display = "none";
            document.getElementById("loginScreen").style.display = "block";
            document.getElementById("mfaStep").style.display = "none";
            document.getElementById("loginStep").style.display = "block";
            document.getElementById("passcode").value = "";
        }

        // Switching folders always clears the open message — it may not belong to the
        // folder being switched to (an archived message isn't in Inbox, etc.).
        function setFolder(folder) {
            currentFolder = folder;
            currentMessageId = null;
            ["inbox", "sent", "archived"].forEach(function (f) {
                document.getElementById("tab_" + f).classList.toggle("active", f === folder);
            });
            document.getElementById("messagePane").innerHTML = EMPTY_PANE_HTML;
            // Don't leave the previous folder's rows on screen under the new tab while
            // the new list is still loading.
            document.getElementById("inboxList").innerHTML = "<p class='hint' style='padding:14px'>Loading...</p>";
            loadInbox();
        }

        function showApp() {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("appScreen").style.display = "block";
            setFolder("inbox");

            // Deep link from the share-notification email (?message=<id>) — open it
            // once, then strip the query string so a page refresh doesn't re-trigger it.
            var params = new URLSearchParams(window.location.search);
            var deepLinkMessageId = params.get("message");
            if (deepLinkMessageId) {
                openMessage(parseInt(deepLinkMessageId));
                window.history.replaceState({}, "", window.location.pathname);
            }
        }

        // Loads whichever folder is current. `folder` is captured up front so a slow
        // response for a folder the user has already clicked away from can't paint over
        // the list for the one they're now looking at.
        function loadInbox() {
            var folder = currentFolder;
            api("/inbox?folder=" + folder)
                .then(function (r) {
                    if (r.status === 401) { logout(); throw new Error("unauthorized"); }
                    return r.text();
                })
                .then(function (txt) {
                    if (folder !== currentFolder) return;
                    var rows = JSON.parse(txt);
                    var list = document.getElementById("inboxList");
                    list.innerHTML = "";
                    if (rows.length === 0) {
                        var emptyText = { inbox: "No messages.", sent: "No sent messages.", archived: "No archived messages." }[folder];
                        list.innerHTML = "<p class='hint' style='padding:14px'>" + emptyText + "</p>";
                        return;
                    }
                    rows.forEach(function (m) {
                        var div = document.createElement("div");
                        // Unread emphasis only means something in the Inbox.
                        div.className = "msgRow" + (folder === "inbox" && !m.DTViewed ? " unread" : "");
                        div.onclick = function () { openMessage(m.MessageID); };
                        var who = folder === "sent"
                            ? "To " + escapeHtml(m.ToNames || "")
                            : escapeHtml(m.FromName) + " (" + escapeHtml(m.FromCompany) + ")";
                        div.innerHTML = "<span class='subj'>" + escapeHtml(m.Subject) + "</span>" +
                            "<span class='meta'>" + who + " &middot; " +
                            new Date(m.DTCreated).toLocaleString() + "</span>";
                        list.appendChild(div);
                    });
                })
                .catch(function (ex) { console.log("loadInbox failed", ex); });
        }

        function openMessage(messageId) {
            currentMessageId = messageId;
            api("/inbox/" + messageId)
                .then(function (r) {
                    if (!r.ok) throw new Error("not found");
                    return r.json();
                })
                .then(function (res) {
                    var msg = JSON.parse(res.message)[0];
                    var items = JSON.parse(res.items);
                    renderMessage(msg, items);
                    loadInbox(); // refresh read/unread state
                })
                .catch(function () {
                    document.getElementById("messagePane").innerHTML = "<p class='err'>Could not open this message.</p>";
                });
        }

        function renderMessage(msg, items) {
            var pane = document.getElementById("messagePane");
            // Server-supplied: a recipient gets Archive + Reply; someone who only
            // AUTHORED the message (the Sent folder) gets a read-only view — archiving
            // is a per-recipient flag they don't have, and every item-access check
            // (IaViewerController/ItemController) requires being a recipient.
            var isRecipient = !!msg.IsRecipient;
            currentArchived = !!msg.IsArchived;

            var html = "<div id='messageScroll'>";
            html += "<h3>" + escapeHtml(msg.Subject) + "</h3>";
            html += isRecipient
                ? "<p class='hint'>From " + escapeHtml(msg.FromName) + " (" + escapeHtml(msg.FromCompany) + ") &middot; " + new Date(msg.DTCreated).toLocaleString() + "</p>"
                : "<p class='hint'>To " + escapeHtml(msg.ToNames || "") + " &middot; " + new Date(msg.DTCreated).toLocaleString() + "</p>";
            html += "<p>" + escapeHtml(msg.Body || "").replace(/\n/g, "<br/>") + "</p>";
            html += "<div id='itemsArea'></div>";
            html += "</div>";
            // Deliberately OUTSIDE #messageScroll, as a fixed sibling — see the
            // #replyBox/#messageScroll CSS comment above.
            if (isRecipient) {
                html += "<div id='replyBox'>" +
                    "<input id='replySubject' placeholder='Subject' value='Re: " + escapeHtml(msg.Subject) + "' />" +
                    "<textarea id='replyBody' placeholder='Message' rows='4'></textarea>" +
                    "<div class='err' id='replyError'></div>" +
                    "<button class='primary' onclick='sendReply()'>Send Reply</button> " +
                    "<button class='secondary' onclick='archiveCurrent()'>" + (currentArchived ? "Move to Inbox" : "Archive") + "</button>" +
                    "</div>";
            }
            pane.innerHTML = html;

            var itemsArea = document.getElementById("itemsArea");
            items.forEach(function (item) {
                var card = document.createElement("div");
                card.className = "itemCard";
                if (!isRecipient) {
                    // In Sent, a task item shows its status — this is how the
                    // assigner sees whether it has been done yet.
                    card.innerHTML = taskBanner(item) + "<strong>" + escapeHtml(item.ItemLabel || item.ItemType) + "</strong>" +
                        "<p class='hint'>Attached to this message. Open it from the message you received, or in CMSNEO.</p>";
                    itemsArea.appendChild(card);
                } else if (item.ItemType === "IAFormRecord") {
                    // Full CMSNEO field-edit/read-only parity, not a flat read-only
                    // table — rendered by CMSNEO's own ported InteractiveForm.js
                    // inside ia-viewer.html, running against this app's own gated
                    // backend (IaViewerController). See that file's comments.
                    // Bounded height, with ia-viewer.html's own body scrolling
                    // internally once content exceeds it (see that file's CSS
                    // comments — overflow/scrolling set from here on the <iframe>
                    // tag itself doesn't reliably control an embedded document's
                    // scrollability) — so a long record scrolls within itself
                    // instead of pushing #replyBox down/out of view.
                    // A task item that hasn't been started (ItemID "0") opens
                    // ia-viewer.html in new-record mode — same page, same URL; the
                    // server decides the mode from the item itself.
                    card.innerHTML = taskBanner(item) +
                        "<div class='mbx-item-header' style='display:flex;justify-content:space-between;align-items:center'>" +
                        "<strong>" + escapeHtml(item.ItemLabel || "Form Application Record") + "</strong>" +
                        "<button class='secondary' onclick='mbxEnterFullscreen(this)'>View Fullscreen</button>" +
                        "</div>" +
                        "<iframe src='ia-viewer.html?messageItemId=" + item.MessageItemID + "' " +
                        "style='width:100%;height:450px;border:1px solid #ccc;margin-top:8px;display:block' " +
                        "title='" + escapeHtml(item.ItemLabel || "Form Application Record") + "'></iframe>";
                    itemsArea.appendChild(card);
                } else {
                    var btn = document.createElement("button");
                    btn.innerText = "Download: " + (item.ItemLabel || item.ItemType);
                    btn.onclick = function () { downloadItem(item.MessageItemID, item.ItemLabel); };
                    card.appendChild(btn);
                    itemsArea.appendChild(card);
                }
            });
        }

        // Task line shown above an item that carries a task (MBX_Task, sql/006). For a
        // form task MBX_GetMessage derives TaskStatus (sql/007): Open (not started),
        // Saved (record saved but not released yet), Completed (released).
        function taskBanner(item) {
            if (!item.TaskID) return "";
            var done = item.TaskStatus === "Completed";
            var what = { FormApplication: "Fill out this form and click Save for Use" }[item.TaskType] || "Task";
            var statusText = { Completed: "Completed", Saved: "Saved - waiting for Save for Use", Cancelled: "Cancelled" }[item.TaskStatus] || "Open";
            // DueDate is a SQL date (serialized as midnight) — show the date part as-is
            // rather than letting a timezone conversion shift it a day.
            var due = item.DueDate ? " &middot; Due " + escapeHtml(String(item.DueDate).substring(0, 10)) : "";
            return "<div class='taskBanner' style='padding:6px 10px;margin-bottom:8px;border-radius:3px;" +
                (done ? "background:#e6f4ea;color:#1e6b34" : "background:#fff4e0;color:#8a5300") + "'>" +
                "<b>Task:</b> " + what + due + " &middot; <b>" + statusText + "</b></div>";
        }

        function downloadItem(messageItemId, label) {
            api("/item/" + messageItemId)
                .then(function (r) {
                    if (!r.ok) throw new Error("denied");
                    return r.blob();
                })
                .then(function (blob) {
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement("a");
                    a.href = url;
                    a.download = label || "download";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                })
                .catch(function () { alert("You no longer have access to this item."); });
        }

        function sendReply() {
            var errDiv = document.getElementById("replyError");
            var body = {
                Subject: document.getElementById("replySubject").value,
                Body: document.getElementById("replyBody").value
            };
            api("/inbox/" + currentMessageId + "/reply", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            })
                .then(function (r) {
                    if (!r.ok) throw new Error("failed");
                    return r.text();
                })
                .then(function () {
                    document.getElementById("replyBody").value = "";
                    loadInbox();
                    errDiv.innerText = "Reply sent.";
                })
                .catch(function () { errDiv.innerText = "Could not send reply."; });
        }

        // Toggles: Archive from the Inbox, Move to Inbox from the Archived folder
        // (the button label is set from the message's own IsArchived in renderMessage).
        // On success the message leaves the current list, so close it and refresh.
        function archiveCurrent() {
            var errDiv = document.getElementById("replyError");
            api("/inbox/" + currentMessageId + "/archive", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ Archived: !currentArchived })
            })
                .then(function (r) {
                    if (r.status === 401) { logout(); throw new Error("unauthorized"); }
                    if (!r.ok) throw new Error("failed");
                    currentMessageId = null;
                    document.getElementById("messagePane").innerHTML = EMPTY_PANE_HTML;
                    loadInbox();
                })
                .catch(function (ex) {
                    if (ex.message !== "unauthorized" && errDiv) errDiv.innerText = "Could not update this message.";
                });
        }

        function escapeHtml(s) {
            return String(s == null ? "" : s)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // Companion to ia-viewer.html's mbxNotifyPopupState() (js/newOpts.js) — that
        // iframe can't make its own popups escape its box, so instead it tells us
        // when one opens/closes and we grow the <iframe> ELEMENT itself to fill the
        // viewport. event.source (not an id) identifies which iframe sent it, since
        // a message can be open with several IAFormRecord items/iframes on screen.
        var mbxFullscreenFrame = null;
        // True once fullscreen was entered via the "View Fullscreen" button rather
        // than a popup — while true, an internal popup opening/closing (View PDF, a
        // confirm dialog, the attachment viewer — ViewDisp()'s UI has several) must
        // NOT auto-exit fullscreen on its own "closed" message; only the explicit
        // Exit Fullscreen button should end a manually-entered fullscreen.
        var mbxManualFullscreen = false;

        // Single choke point for entering/exiting the fullscreen visual state, so
        // the frame class, the Exit button, and hiding itemCard headers (see the
        // .mbx-item-header CSS comment) can never drift out of sync across the four
        // places fullscreen can be triggered/ended (a popup opening, a popup closing,
        // the View Fullscreen button, the Exit Fullscreen button).
        function mbxSetFullscreen(frame) {
            if (mbxFullscreenFrame && mbxFullscreenFrame !== frame) {
                mbxFullscreenFrame.classList.remove("mbx-iframe-fullscreen");
            }
            frame.classList.add("mbx-iframe-fullscreen");
            mbxFullscreenFrame = frame;
            document.body.classList.add("mbx-fullscreen-active");
            document.getElementById("mbxExitFullscreenBtn").style.display = "block";
        }

        function mbxClearFullscreen() {
            if (mbxFullscreenFrame) mbxFullscreenFrame.classList.remove("mbx-iframe-fullscreen");
            mbxFullscreenFrame = null;
            mbxManualFullscreen = false;
            document.body.classList.remove("mbx-fullscreen-active");
            document.getElementById("mbxExitFullscreenBtn").style.display = "none";
        }

        window.addEventListener("message", function (event) {
            if (event.origin !== window.location.origin) return;
            // ia-viewer.html's mbxNewRecordSaved(): a new-record task was just saved.
            // Re-open the message so the item shows the saved record and the task's
            // new status.
            if (event.data && event.data.mbxTaskSaved) {
                mbxClearFullscreen();
                if (currentMessageId) openMessage(currentMessageId);
                return;
            }
            if (!event.data || (event.data.mbxPopup !== "open" && event.data.mbxPopup !== "closed")) return;

            var frames = document.querySelectorAll("#messagePane iframe");
            for (var i = 0; i < frames.length; i++) {
                if (frames[i].contentWindow === event.source) {
                    if (event.data.mbxPopup === "open") {
                        mbxSetFullscreen(frames[i]);
                    } else if (mbxFullscreenFrame === frames[i] && !mbxManualFullscreen) {
                        mbxClearFullscreen();
                    }
                    break;
                }
            }
        });

        // Lets a user go fullscreen straight away to read/work a record comfortably,
        // without first having to open some popup inside it just to trigger
        // mbxNotifyPopupState. `btn` is the clicked button itself — its own itemCard
        // sibling iframe is the one to fullscreen (a message can have more than one
        // IAFormRecord item/iframe on screen at once).
        function mbxEnterFullscreen(btn) {
            var frame = btn.closest(".itemCard").querySelector("iframe");
            if (!frame) return;
            mbxSetFullscreen(frame);
            mbxManualFullscreen = true;
        }

        // Manual escape hatch (see the button's CSS comment) — just undoes the visual
        // fullscreen; it doesn't reach into the iframe to close the popup itself, so
        // the ported code's own PopUp() state is left alone.
        function mbxExitFullscreen() {
            mbxClearFullscreen();
        }

        if (token) { showApp(); }
    </script>
</body>
</html>
